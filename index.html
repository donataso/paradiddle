<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Paradiddle</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23d4572a'/><text x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>P</text></svg>">
</head>
<body>
  <header class="topbar">
    <button id="menuBtn" class="icon" aria-label="Rudiments list">☰</button>
    <h1><a href="https://github.com/donataso/paradiddle" target="_blank" rel="noopener">Paradiddle</a></h1>
    <span class="byline">by Donatas Olsevičius</span>
    <nav class="tabs" role="tablist">
      <button role="tab" data-mode="rudiment" aria-selected="true">Rudiments</button>
      <button role="tab" data-mode="metronome" aria-selected="false">Metronome</button>
    </nav>
  </header>

  <div class="layout">
    <aside id="library" class="library">
      <div class="lib-actions">
        <button id="newBtn">New</button>
        <button id="uploadBtn">Upload</button>
        <button id="downloadAllBtn">Download all</button>
        <input id="fileInput" type="file" accept=".json,application/json" hidden>
      </div>
      <div id="libList" class="lib-list"></div>
    </aside>
    <div id="scrim" class="scrim" hidden></div>

    <main>
      <section id="rudimentView">
        <div class="titlebar">
          <div>
            <h2 id="rTitle"></h2>
            <div id="rMeta" class="meta"></div>
          </div>
          <div class="title-actions">
            <button id="copyBtn">Copy</button>
            <button id="editBtn">Edit</button>
            <button id="downloadBtn">Download</button>
          </div>
        </div>
        <div id="sheet" class="sheet"><div id="marker" class="marker" hidden></div></div>
        <div id="editor" class="editor" hidden></div>
      </section>

      <section id="metronomeView" hidden>
        <div class="metro-time">
          <label>Time
            <span><input id="mNum" type="number" min="1" max="32" inputmode="numeric"> /
            <select id="mDen"><option>2</option><option>4</option><option>8</option><option>16</option></select></span>
          </label>
          <label id="mGroupsWrap">Grouping <input id="mGroups" placeholder="2+2+3"></label>
        </div>
        <div id="bigBeats" class="big-beats"></div>
      </section>

      <section class="transport">
        <button id="playBtn" class="play" aria-label="Play">▶</button>
        <div class="tempo">
          <button data-tempo="-5">−5</button>
          <button data-tempo="-1">−1</button>
          <label class="bpm"><span>♩ =</span><input id="tempoInput" type="number" inputmode="numeric"></label>
          <button data-tempo="1">+1</button>
          <button data-tempo="5">+5</button>
          <input id="tempoRange" type="range" aria-label="Tempo">
        </div>
        <div class="status">
          <div id="beats" class="beats"></div>
          <div id="statusText" class="status-text"></div>
        </div>
      </section>

      <section class="settings">
        <fieldset>
          <legend>Metronome</legend>
          <label class="check"><input id="clickOn" type="checkbox"> Click with rudiment</label>
          <label class="check"><input id="countIn" type="checkbox"> 1 bar count-in</label>
          <label>Subdivision
            <select id="subSel">
              <option value="1">Off</option>
              <option value="2">2 per beat</option>
              <option value="3">3 per beat</option>
              <option value="4">4 per beat</option>
            </select>
          </label>
        </fieldset>
        <fieldset>
          <legend>Sounds</legend>
          <label>Rudiment <select id="rudVoice"></select></label>
          <label>Volume <input id="rudVol" type="range" min="0" max="1" step="0.01"></label>
          <label>Click <select id="clickVoice"></select></label>
          <label>Volume <input id="clickVol" type="range" min="0" max="1" step="0.01"></label>
        </fieldset>
        <fieldset>
          <legend>Speed trainer</legend>
          <label class="check"><input id="trOn" type="checkbox"> Enabled</label>
          <div class="row">
            <label>Start <input id="trStart" type="number" inputmode="numeric"></label>
            <label>Target <input id="trTarget" type="number" inputmode="numeric"></label>
          </div>
          <div class="row">
            <label>Step <input id="trStep" type="number" min="1" inputmode="numeric"></label>
            <label>Every <input id="trEvery" type="number" min="1" inputmode="numeric"> loops</label>
          </div>
        </fieldset>
      </section>
    </main>
  </div>

  <datalist id="catList"></datalist>
  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
