<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Paradiddle</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#d4572a">
</head>
<body>
  <header class="topbar">
    <button id="menuBtn" class="icon" aria-label="Rudiments list">☰</button>
    <h1><a href="https://github.com/donataso/paradiddle" target="_blank" rel="noopener">Paradiddle</a></h1>
    <span class="byline">by <a href="https://www.linkedin.com/in/olsevicius/" target="_blank" rel="noopener">Donatas Olsevičius</a></span>
    <nav class="tabs" role="tablist">
      <button role="tab" data-mode="rudiment" aria-selected="true">Rudiments</button>
      <button role="tab" data-mode="metronome" aria-selected="false">Metronome</button>
    </nav>
    <details id="sponsor" class="sponsor">
      <summary aria-label="Support"><span aria-hidden="true">♥</span><span class="sponsor-label">Support</span></summary>
      <div class="sponsor-menu">
        <a href="http://paypal.me/donataso" target="_blank" rel="noopener">PayPal</a>
        <a href="https://github.com/sponsors/donataso" target="_blank" rel="noopener">GitHub</a>
      </div>
    </details>
  </header>

  <div class="layout">
    <aside id="library" class="library">
      <div class="lib-about">
        <div>by <a href="https://www.linkedin.com/in/olsevicius/" target="_blank" rel="noopener">Donatas Olsevičius</a></div>
        <div><span class="heart" aria-hidden="true">♥</span> Support:
          <a href="http://paypal.me/donataso" target="_blank" rel="noopener">PayPal</a> ·
          <a href="https://github.com/sponsors/donataso" target="_blank" rel="noopener">GitHub</a>
        </div>
      </div>
      <div id="libList" class="lib-list"></div>
      <div class="lib-actions">
        <button id="newBtn" class="icon-btn" data-icon="plus" title="New rudiment" aria-label="New rudiment"></button>
        <button id="uploadBtn">Upload</button>
        <button id="downloadAllBtn">Download all</button>
        <input id="fileInput" type="file" accept=".json,application/json" hidden>
      </div>
    </aside>
    <div id="scrim" class="scrim" hidden></div>

    <main>
      <section id="rudimentView">
        <div class="titlebar">
          <div>
            <h2 id="rTitle"></h2>
            <div id="rMeta" class="meta"></div>
          </div>
          <div class="title-actions">
            <button id="copyBtn" class="icon-btn" data-icon="copy" title="Copy" aria-label="Copy"></button>
            <button id="editBtn" class="icon-btn" data-icon="edit" title="Edit" aria-label="Edit"></button>
            <button id="downloadBtn" class="icon-btn" data-icon="download" title="Download" aria-label="Download"></button>
            <button id="deleteBtn" class="icon-btn danger" data-icon="trash" title="Delete" aria-label="Delete"></button>
          </div>
        </div>
        <div id="sheet" class="sheet"><div id="statusText" class="status-text"></div><div id="beats" class="beats"></div><div id="marker" class="marker" hidden></div></div>
        <div id="editor" class="editor" hidden></div>
      </section>

      <section id="metronomeView" hidden>
        <div id="bigBeats" class="big-beats"><div id="bigBeatsDots" class="big-beats-dots"></div></div>
      </section>

      <section class="transport">
        <button id="playBtn" class="play" aria-label="Play"></button>
        <div class="tempo">
          <button data-tempo="-10">−10</button>
          <button data-tempo="-5">−5</button>
          <label class="bpm"><input id="tempoInput" type="number" inputmode="numeric" aria-label="Tempo (BPM)" title="Tempo (BPM)"></label>
          <button data-tempo="5">+5</button>
          <button data-tempo="10">+10</button>
          <input id="tempoRange" type="range" aria-label="Tempo">
        </div>
      </section>

      <section class="settings">
        <fieldset>
          <legend>Metronome</legend>
          <div class="metro-time">
            <label>Time
              <span><input id="mNum" type="number" min="1" max="32" inputmode="numeric"> /
              <select id="mDen"><option>2</option><option>4</option><option>8</option><option>16</option></select></span>
            </label>
            <label id="mGroupsWrap">Grouping <span id="mGroups" class="group-picker"></span></label>
          </div>
          <label class="check"><input id="countIn" type="checkbox"> 1 bar count-in</label>
          <label>Subdivision
            <select id="subSel">
              <option value="1">Off</option>
              <option value="2">2 per beat</option>
              <option value="3">3 per beat</option>
              <option value="4">4 per beat</option>
              <option value="5">5 per beat</option>
              <option value="6">6 per beat</option>
              <option value="7">7 per beat</option>
            </select>
          </label>
        </fieldset>
        <fieldset>
          <legend>Sounds</legend>
          <label>Rudiment <select id="rudVoice"></select></label>
          <label>Volume <input id="rudVol" type="range" min="0" max="1" step="0.01"></label>
          <label>Click <select id="clickVoice"></select></label>
          <label>Volume <input id="clickVol" type="range" min="0" max="1" step="0.01"></label>
        </fieldset>
        <fieldset>
          <legend>Speed trainer</legend>
          <label class="check"><input id="trOn" type="checkbox"> Enabled</label>
          <div class="tr-grid">
            <label for="trStart">Start</label><input id="trStart" type="number" inputmode="numeric">
            <label for="trTarget">Target</label><input id="trTarget" type="number" inputmode="numeric">
            <label for="trStep">Step</label><input id="trStep" type="number" min="1" inputmode="numeric">
            <label for="trEvery">Every</label><span><input id="trEvery" type="number" min="1" inputmode="numeric"> loops</span>
          </div>
        </fieldset>
      </section>
    </main>
  </div>

  <datalist id="catList"></datalist>
  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
